<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Meus Sonhos & Metas • Nova versão</title><style>
:root{--bg:#fff8fa;--card:#fff;--ink:#513744;--muted:#886e7a;--pink:#b44b79;--soft:#fbe8f0;--line:#f0dce5;--accent:#823b5a;--green:#4a8a70}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--accent)}.app{display:flex;min-height:100vh}.sidebar{width:240px;background:white;border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;flex-shrink:0}.brand{font-family:Georgia,serif;font-size:23px;color:var(--accent);margin:9px 6px 24px}.brand small{display:block;color:var(--muted);font:11px system-ui;letter-spacing:2px}.nav{display:block;width:100%;border:0;border-radius:12px;padding:13px 14px;text-align:left;background:transparent;color:var(--ink);margin:3px 0}.nav.active,.nav:hover{background:var(--soft);color:#983e69}.main{max-width:1150px;width:100%;margin:auto;padding:38px 32px 75px}h1{font:36px Georgia,serif;margin:0 0 7px}h2{font:26px Georgia,serif;margin:0 0 15px}h3{margin:0 0 8px}p{margin:6px 0 14px}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:23px;box-shadow:0 6px 22px #84475a0a;margin-bottom:15px}.hero{background:linear-gradient(120deg,#fbe3ed,#fff7f3);padding:32px;border-radius:23px;margin-bottom:18px}.pill{display:inline-block;background:var(--soft);border-radius:20px;padding:4px 11px;color:var(--accent);font-size:12px}button.primary{border:0;background:var(--pink);color:#fff;border-radius:12px;padding:10px 16px}button.secondary{border:1px solid #e8bfd0;background:white;color:var(--accent);border-radius:12px;padding:9px 14px}button.danger{border:0;background:#fbe6e8;color:#963e52;border-radius:10px;padding:7px 10px}button:disabled{opacity:.5}label{font-size:13px;font-weight:650;display:block;margin:12px 0 5px}input,select,textarea{width:100%;border:1px solid #e9cdd9;border-radius:11px;padding:10px 11px;background:white;color:var(--ink)}textarea{min-height:95px;resize:vertical}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.bar{height:9px;border-radius:10px;background:#f7e5ec;overflow:hidden}.bar>div{height:100%;background:var(--pink);border-radius:10px}.photo{max-width:100%;max-height:245px;object-fit:cover;border-radius:13px}.thumb{width:80px;height:86px;object-fit:cover;border-radius:12px}.notice{border-left:4px solid var(--pink);padding:12px 16px;background:#fff1f5;border-radius:9px;margin-bottom:19px}.viewer{background:#fff;border-radius:14px;padding:22px;min-height:240px;border:1px solid var(--line)}.verse{font-family:Georgia,serif;line-height:1.9;font-size:19px}.tag{font-size:11px;color:#a54a75;letter-spacing:1px}.tile{min-height:195px;background:linear-gradient(140deg,#f6dbe7,#fceef2);border-radius:18px;display:grid;place-content:center;text-align:center;padding:20px}.tile strong{font:27px Georgia,serif}.hide{display:none}.book-reader{width:100%;height:65vh;border:1px solid var(--line);border-radius:12px}#epub-area{height:65vh;background:white;overflow:hidden}.mini{font-size:13px}.footer{margin-top:35px;color:var(--muted);font-size:12px}.mobile-nav{display:none}@media(max-width:740px){.app{display:block}.sidebar{position:static;width:auto;height:auto;padding:12px}.brand{margin:2px 8px}.sidebar nav{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}.nav{flex:0 0 auto;width:auto;font-size:13px;padding:9px}.main{padding:21px 15px 70px}h1{font-size:29px}.card{padding:17px}.hero{padding:22px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">🌸 Meus Sonhos <small>& METAS · MEU CANTINHO</small></div><nav id="menu"></nav><p class="muted small" style="padding:12px">Um passo de cada vez. 🌷</p></aside><main class="main"><div id="app"></div><div class="footer">Versão de teste · dados novos salvos neste navegador, sem nuvem · mantenha seu site original.</div></main></div>
<script>
'use strict';const $=q=>document.querySelector(q),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),iso=()=>new Date().toLocaleDateString('en-CA');
const storeKey='jeh_site_beta_v1';let data;try{data=JSON.parse(localStorage.getItem(storeKey)||'null')}catch{} data||={profile:{name:'Meu perfil',quote:'Não existe mudança sem constância. 🌷✨'},routine:[],records:[],notes:[],dreams:[],books:[],bibleDone:{},plan:[{date:'2026-11-23',book:'Atos',start:15,end:16}],slides:[],profilePhoto:''};
function save(){try{localStorage.setItem(storeKey,JSON.stringify(data))}catch(e){alert('O armazenamento local ficou cheio. Exporte seu backup.') }}
const sections=[['home','🏠 Início'],['routine','📅 Minha Rotina'],['bible','📖 Ler a Bíblia'],['plan','🙏 Plano Bíblico'],['library','📚 Minha Biblioteca'],['notes','📝 Caderno de Anotações'],['dreams','🏡 Mural dos Sonhos'],['profile','👤 Meu Perfil'],['backup','💾 Backup']];let page='home',activeBook=null,readerPage=1,epubBook=null,epubRendition=null,carouselPos=0;
function shell(title,subtitle){return `<h1>${title}</h1><p class="muted">${subtitle}</p>`}function nav(p){page=p;activeBook=null;render()}function render(){if(epubBook){try{epubBook.destroy()}catch{}epubBook=null;epubRendition=null}$('#menu').innerHTML=sections.map(([k,l])=>`<button class="nav ${page===k?'active':''}" data-nav="${k}">${l}</button>`).join('');$('#app').innerHTML=({home,routine,bible,plan,library,notes,dreams,profile,backup}[page]||home)();document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));bind();}
const photoButton=(id,label)=>`<label for="${id}">${label}</label><input id="${id}" type="file" accept="image/*">`;
function home(){let slides=data.slides;let item=slides.length?slides[carouselPos%slides.length]:null;return `<div class="hero"><span class="tag">SEU ESPAÇO PESSOAL</span><h1>Floresça no seu tempo. 🌷</h1><p>Organize sua rotina, sua fé, seus livros e tudo o que sonha conquistar.</p></div><div class="grid"><div class="card"><div class="row between"><h3>✨ Meu mural de inspiração</h3><span class="pill">Fotos em sequência</span></div><div id="slide">${item?`<img src="${item.src}" class="photo" style="width:100%;height:245px"><p>${esc(item.caption)}</p>`:`<div class="tile"><strong>Não existe mudança sem constância.</strong><p>🌸 ✨ 🌷</p></div>`}</div>${photoButton('slide-file','Adicionar uma foto à apresentação')}<input id="slide-caption" placeholder="Frase para a foto (opcional)"><div class="row" style="margin-top:10px"><button class="secondary" id="slide-prev">←</button><button class="secondary" id="slide-next">→</button></div><p class="muted small">As fotos alternam a cada 6 segundos nesta tela.</p></div><div class="card"><h3>📅 Minha rotina</h3><p>${data.routine.length} atividades cadastradas</p><button class="primary" data-goto="routine">Abrir minha rotina</button><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>📚 Minha biblioteca</h3><p>${data.books.length} livros adicionados</p><button class="secondary" data-goto="library">Continuar lendo</button><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>🙏 Plano bíblico</h3><p>Leituras com acesso direto aos capítulos.</p><button class="secondary" data-goto="plan">Abrir plano</button></div></div>`}
function totalMinutes(id){return data.records.filter(x=>x.rid===id).reduce((n,x)=>n+Number(x.mins||0),0)}function routine(){return shell('Minha Rotina 🌸','Suas atividades, registros, fotos e progresso, sem limite de tempo.')+`<div class="card"><h3>+ Nova atividade</h3><form id="routine-add" class="grid"><div><label>Nome</label><input name="name" required placeholder="Estudo de português"></div><div><label>Categoria</label><select name="category"><option>Estudos</option><option>Espiritualidade</option><option>Saúde</option><option>Trabalho</option><option>Outros</option></select></div><div><label>Minutos de referência por sessão (opcional)</label><input type="number" min="0" name="target" placeholder="Ex.: 60"></div><div style="align-self:end"><button class="primary">Criar atividade</button></div></form></div>`+data.routine.map(r=>{const records=data.records.filter(x=>x.rid===r.id);let mins=totalMinutes(r.id),todayMins=records.filter(x=>x.date===iso()).reduce((a,x)=>a+Number(x.mins),0),pct=r.target?Math.round(todayMins/r.target*100):null;return `<div class="card"><div class="row between"><div><span class="tag">${esc(r.category)}</span><h2>${esc(r.name)}</h2></div><button class="danger" data-delete-routine="${r.id}">Excluir atividade</button></div><p><b>${mins} minutos</b> acumulados · ${records.length} registros</p><p>Hoje: <strong>${todayMins} min</strong> ${pct!==null?`· ${pct}% da referência de ${r.target} min`: '· sem meta de tempo fixa'}</p>${pct!==null?`<div class="bar"><div style="width:${Math.min(100,pct)}%"></div></div>`:''}<form class="record-add" data-rid="${r.id}"><div class="grid"><div><label>Data</label><input type="date" name="date" value="${iso()}" required></div><div><label>Minutos realizados</label><input type="number" min="1" name="mins" required placeholder="30"></div></div><label>Anotação (opcional)</label><input name="comment" placeholder="O que aprendi ou fiz hoje?"><label>Foto do estudo / exercício (opcional)</label><input name="photo" type="file" accept="image/*"><button class="primary" style="margin-top:12px">Registrar atividade</button></form><details style="margin-top:15px"><summary>Histórico (${records.length})</summary>${records.slice().reverse().map(v=>`<div style="padding:12px;border-bottom:1px solid var(--line)"><b>${esc(v.date)} — ${v.mins} min</b><p>${esc(v.comment||'')}</p>${v.photo?`<img class="thumb" src="${v.photo}">`:''}</div>`).join('')}</details></div>`}).join('')}
const bibleNames=['Gênesis','Êxodo','Levítico','Números','Deuteronômio','Josué','Juízes','Rute','1 Samuel','2 Samuel','1 Reis','2 Reis','1 Crônicas','2 Crônicas','Esdras','Neemias','Ester','Jó','Salmos','Provérbios','Eclesiastes','Cânticos','Isaías','Jeremias','Lamentações','Ezequiel','Daniel','Oseias','Joel','Amós','Obadias','Jonas','Miqueias','Naum','Habacuque','Sofonias','Ageu','Zacarias','Malaquias','Mateus','Marcos','Lucas','João','Atos','Romanos','1 Coríntios','2 Coríntios','Gálatas','Efésios','Filipenses','Colossenses','1 Tessalonicenses','2 Tessalonicenses','1 Timóteo','2 Timóteo','Tito','Filemom','Hebreus','Tiago','1 Pedro','2 Pedro','1 João','2 João','3 João','Judas','Apocalipse'];const slugs='genesis exodus leviticus numbers deuteronomy joshua judges ruth 1-samuel 2-samuel 1-kings 2-kings 1-chronicles 2-chronicles ezra nehemiah esther job psalms proverbs ecclesiastes song-of-solomon isaiah jeremiah lamentations ezekiel daniel hosea joel amos obadiah jonah micah nahum habakkuk zephaniah haggai zechariah malachi matthew mark luke john acts romans 1-corinthians 2-corinthians galatians ephesians philippians colossians 1-thessalonians 2-thessalonians 1-timothy 2-timothy titus philemon hebrews james 1-peter 2-peter 1-john 2-john 3-john jude revelation'.split(' ');let selectedBible={book:'Atos',ch:15,version:'alm1911'},readingSequence=null;
function bible(){return shell('Ler a Bíblia 📖','Leitura livre, independente do plano bíblico.')+`<div class="notice">Traduções oferecidas via API pública: Almeida 1911 e Bíblia Livre, sujeitas à disponibilidade do serviço. NVI e NTLH não foram incorporadas porque exigem licença.</div><div class="card"><div class="grid"><div><label>Tradução</label><select id="b-version"><option value="alm1911" ${selectedBible.version==='alm1911'?'selected':''}>Almeida 1911 (domínio público)</option><option value="bibliavre" ${selectedBible.version==='bibliavre'?'selected':''}>Bíblia Livre (verificar disponibilidade)</option></select></div><div><label>Livro</label><select id="b-book">${bibleNames.map(n=>`<option ${selectedBible.book===n?'selected':''}>${n}</option>`).join('')}</select></div><div><label>Capítulo</label><input id="b-ch" type="number" min="1" max="150" value="${selectedBible.ch}"></div></div><button class="primary" id="b-read" style="margin:15px 0">Abrir capítulo</button><div id="b-text" class="viewer"><p class="muted">Escolha o capítulo para começar a leitura.</p></div><div class="row" style="margin-top:13px"><button id="b-next" class="secondary">Próximo capítulo →</button><button data-goto="plan" class="secondary">Meu Plano Bíblico</button></div></div>`}
async function readBible(){const idx=bibleNames.indexOf(selectedBible.book);const target=$('#b-text');if(!target)return;target.innerHTML='<p>Carregando o capítulo…</p>';try{const u=`https://api.midvash.com/v1/${encodeURIComponent(selectedBible.version)}/${slugs[idx]}/${selectedBible.ch}?locale=pt-br`;let r=await fetch(u);if(!r.ok)throw Error('Essa tradução ou capítulo não está disponível neste momento.');let j=await r.json();if(!Array.isArray(j.data?.verses))throw Error('Não foi possível interpretar o capítulo.');target.innerHTML=`<h2>${esc(selectedBible.book)} ${selectedBible.ch}</h2>`+j.data.verses.map((v,i)=>`<p class="verse"><sup style="color:var(--pink)">${esc(v.number||i+1)}</sup> ${esc(typeof v.text==='string'?v.text:v.content||'')}</p>`).join('')+`<p class="muted small">Fonte: API Midvash. Confira a licença e atribuição da tradução.</p>`;target.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){target.innerHTML=`<p>⚠️ ${esc(e.message)}</p><p>É necessária conexão com a internet. Você também pode abrir a leitura em uma plataforma bíblica autorizada.</p>`}}
function plan(){const planRows=data.plan.slice().sort((a,b)=>a.date.localeCompare(b.date));return shell('Plano Bíblico 🙏','Clique na leitura para abrir diretamente o primeiro capítulo e seguir para o próximo.')+`<div class="card"><h3>Adicionar leitura ao plano</h3><form id="plan-add" class="grid"><div><label>Dia</label><input name="date" type="date" value="${iso()}" required></div><div><label>Livro</label><select name="book">${bibleNames.map(n=>`<option>${n}</option>`).join('')}</select></div><div><label>Capítulo inicial</label><input name="start" type="number" min="1" value="1" required></div><div><label>Capítulo final</label><input name="end" type="number" min="1" value="2" required></div><div style="align-self:end"><button class="primary">Adicionar leitura</button></div></form></div><div class="notice">Incluí Atos 15 e 16 como exemplo de 23/11/2026. A sequência anual completa ainda precisa ser importada do seu plano original, para não inventar leituras.</div>`+planRows.map((r,i)=>`<div class="card"><div class="row between"><div><span class="pill">${r.date===iso()?'✨ Hoje':esc(r.date)}</span><h3 style="margin-top:8px">${esc(r.book)} ${r.start}${r.end!==r.start?' e '+r.end:''}</h3></div><button class="primary" data-plan-open="${i}">📖 Abrir leitura</button></div><label style="font-weight:400"><input style="width:auto" type="checkbox" data-plan-done="${esc(r.date)}" ${data.bibleDone[r.date]?'checked':''}> Li os capítulos de hoje</label></div>`).join('')}
function library(){return shell('Minha Biblioteca 📚','Adicione seus PDFs e EPUBs e continue de onde parou.')+`<div class="notice">Os livros ficam armazenados neste navegador, por enquanto. O backup de metadados NÃO inclui os arquivos. Não publique livros pessoais no repositório público do GitHub.</div><div class="card"><h3>Adicionar livro</h3><form id="book-add"><label>Nome do livro</label><input name="title" placeholder="Título da obra" required><label>Arquivo PDF ou EPUB</label><input name="file" type="file" accept=".pdf,.epub,application/pdf,application/epub+zip" required><button class="primary" style="margin-top:12px">Adicionar à biblioteca</button></form></div><div class="grid">${data.books.map(b=>`<div class="card"><span class="tag">${esc(b.type)}</span><h3>${esc(b.title)}</h3><p class="muted">${b.type==='pdf'?`Página ${b.page||1}`:b.cfi?'Posição de leitura salva':'Ainda não iniciado'}</p><div class="row"><button class="primary" data-open-book="${b.id}">📖 Continuar lendo</button><button class="danger" data-book-delete="${b.id}">Excluir</button></div></div>`).join('')}</div><div id="book-modal"></div>`}
function notes(){return shell('Caderno de Anotações 📝','Um lugar para registrar suas ideias, resumos e pensamentos.')+`<div class="card"><form id="note-add"><label>Título</label><input name="title" required placeholder="Meu estudo de hoje"><label>Minhas anotações</label><textarea name="body" required placeholder="Escreva aqui..."></textarea><button class="primary">Salvar anotação</button></form></div>`+data.notes.slice().reverse().map(n=>`<div class="card"><div class="row between"><h3>${esc(n.title)}</h3><button class="danger" data-note-del="${n.id}">Excluir</button></div><p class="muted small">${esc(n.date)}</p><p style="white-space:pre-wrap">${esc(n.body)}</p></div>`).join('')}
function dreams(){return shell('Mural dos Sonhos 🏡','Seu espaço para visualizar as conquistas que deseja realizar.')+`<div class="card"><form id="dream-add"><label>Meu sonho</label><input name="title" required placeholder="Conquistar minha casa própria"><label>Uma frase de inspiração</label><input name="desc"><label>Imagem (opcional)</label><input name="photo" type="file" accept="image/*"><button class="primary" style="margin-top:12px">Adicionar ao mural</button></form></div><div class="grid">${data.dreams.map(d=>`<div class="card">${d.photo?`<img src="${d.photo}" class="photo" style="width:100%;height:180px">`:'<div class="tile">🌷✨</div>'}<h3>${esc(d.title)}</h3><p>${esc(d.desc||'')}</p><button class="danger" data-dream-del="${d.id}">Excluir</button></div>`).join('')}</div>`}
function profile(){return shell('Meu Perfil 👤','Deixe seu cantinho com a sua personalidade.')+`<div class="card"><div class="row" style="align-items:start">${data.profilePhoto?`<img src="${data.profilePhoto}" class="photo" style="height:135px;width:135px">`:'<div class="tile" style="height:110px;width:110px;min-height:0">🌸</div>'}<div style="flex:1"><h2>${esc(data.profile.name)}</h2><p>“${esc(data.profile.quote)}”</p></div></div><form id="profile-form"><label>Nome no perfil</label><input name="name" value="${esc(data.profile.name)}"><label>Minha frase especial</label><input name="quote" value="${esc(data.profile.quote)}"><label>Minha foto</label><input type="file" accept="image/*" name="photo"><button class="primary" style="margin-top:13px">Salvar meu perfil</button></form></div>`}
function backup(){return shell('Backup dos dados 💾','Proteja suas informações antes de qualquer mudança.')+`<div class="notice"><strong>Importante:</strong> esta versão ainda não sincroniza com a nuvem e não importa automaticamente as metas do site antigo. Os backups exportados daqui incluem textos e imagens pequenas, mas NÃO incluem os PDFs/EPUBs guardados no IndexedDB.</div><div class="card"><h3>Exportar e importar</h3><p>Guarde uma cópia dos registros desta versão.</p><div class="row"><button class="primary" id="backup-export">Baixar backup JSON</button></div><label>Restaurar backup desta versão</label><input id="backup-import" type="file" accept=".json,application/json"><p class="muted small">Não substitua um backup do site original por este: os formatos podem ser diferentes.</p></div>`}
function fileAsData(file,max=850){return new Promise((resolve,reject)=>{if(!file || !file.size)return resolve('');if(!file.type.startsWith('image/'))return reject(Error('Escolha uma imagem.'));const image=new Image(),url=URL.createObjectURL(file);image.onload=()=>{const s=Math.min(1,max/Math.max(image.width,image.height)),c=document.createElement('canvas');c.width=Math.round(image.width*s);c.height=Math.round(image.height*s);c.getContext('2d').drawImage(image,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.72))};image.onerror=reject;image.src=url})}
function uid(){return String(Date.now())+Math.random().toString(16).slice(2)}
function bind(){document.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>nav(el.dataset.goto));
if(page==='home'){const up=$('#slide-file');up.onchange=async()=>{try{let src=await fileAsData(up.files[0]);data.slides.push({src,caption:$('#slide-caption').value});carouselPos=data.slides.length-1;save();render()}catch(e){alert(e.message)}};$('#slide-next').onclick=()=>{carouselPos++;render()};$('#slide-prev').onclick=()=>{carouselPos=Math.max(0,carouselPos-1);render()}}
if(page==='routine'){$('#routine-add').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.routine.push({id:uid(),name:f.get('name'),category:f.get('category'),target:Number(f.get('target'))||0});save();render()};document.querySelectorAll('.record-add').forEach(f=>f.onsubmit=async e=>{e.preventDefault();try{let fd=new FormData(f),photo=await fileAsData(fd.get('photo'));data.records.push({id:uid(),rid:f.dataset.rid,date:fd.get('date'),mins:Number(fd.get('mins')),comment:fd.get('comment'),photo});save();render()}catch(x){alert(x.message)}});document.querySelectorAll('[data-delete-routine]').forEach(b=>b.onclick=()=>{if(confirm('Excluir esta atividade e o histórico dela?')){data.routine=data.routine.filter(r=>r.id!==b.dataset.deleteRoutine);data.records=data.records.filter(r=>r.rid!==b.dataset.deleteRoutine);save();render()}})}
if(page==='bible'){$('#b-read').onclick=()=>{readingSequence=null;selectedBible={version:$('#b-version').value,book:$('#b-book').value,ch:Math.max(1,Number($('#b-ch').value)||1)};readBible()};$('#b-next').onclick=()=>{if(readingSequence && selectedBible.book===readingSequence.book && selectedBible.ch>=readingSequence.end){alert('Você terminou os capítulos desta leitura! Volte ao Plano Bíblico para marcar como concluída.');return}selectedBible.ch++;$('#b-ch').value=selectedBible.ch;readBible()}}
if(page==='plan'){$('#plan-add').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),start=Number(f.get('start')),end=Number(f.get('end'));if(end<start)return alert('O capítulo final deve ser igual ou maior que o inicial.');data.plan.push({date:f.get('date'),book:f.get('book'),start,end});save();render()};document.querySelectorAll('[data-plan-done]').forEach(b=>b.onchange=()=>{data.bibleDone[b.dataset.planDone]=b.checked;save()});document.querySelectorAll('[data-plan-open]').forEach(b=>b.onclick=()=>{let r=data.plan.slice().sort((a,b)=>a.date.localeCompare(b.date))[Number(b.dataset.planOpen)];selectedBible={book:r.book,ch:r.start,version:'alm1911'};readingSequence={book:r.book,end:r.end};page='bible';render();readBible()})}
if(page==='notes'){$('#note-add').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);data.notes.push({id:uid(),title:f.get('title'),body:f.get('body'),date:iso()});save();render()};document.querySelectorAll('[data-note-del]').forEach(b=>b.onclick=()=>{if(confirm('Excluir?')){data.notes=data.notes.filter(n=>n.id!==b.dataset.noteDel);save();render()}})}
if(page==='dreams'){$('#dream-add').onsubmit=async e=>{e.preventDefault();try{let f=new FormData(e.target),photo=await fileAsData(f.get('photo'));data.dreams.push({id:uid(),title:f.get('title'),desc:f.get('desc'),photo});save();render()}catch(x){alert(x.message)}};document.querySelectorAll('[data-dream-del]').forEach(b=>b.onclick=()=>{data.dreams=data.dreams.filter(x=>x.id!==b.dataset.dreamDel);save();render()})}
if(page==='profile'){$('#profile-form').onsubmit=async e=>{e.preventDefault();try{let f=new FormData(e.target);data.profile={name:f.get('name'),quote:f.get('quote')};if(f.get('photo')?.size)data.profilePhoto=await fileAsData(f.get('photo'));save();render()}catch(x){alert(x.message)}}}
if(page==='backup'){$('#backup-export').onclick=()=>{const a=document.createElement('a'),blob=new Blob([JSON.stringify({format:'jeh-beta-v1',data},null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='meus-sonhos-backup-beta-'+iso()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};$('#backup-import').onchange=async e=>{try{let parsed=JSON.parse(await e.target.files[0].text());if(parsed.format!=='jeh-beta-v1'||!parsed.data?.routine)throw Error('Formato de backup incompatível');if(confirm('Substituir os registros desta versão de teste?')){data=parsed.data;save();render()}}catch(x){alert(x.message)}}}
if(page==='library'){$('#book-add').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),file=f.get('file'),ext=file.name.split('.').pop().toLowerCase();if(!['pdf','epub'].includes(ext))return alert('Escolha PDF ou EPUB');try{await dbPut(file,uid()).then(id=>{data.books.push({id,title:f.get('title'),type:ext,page:1,cfi:''});save();render()})}catch(x){alert('Falha ao guardar livro: '+x.message)}};document.querySelectorAll('[data-open-book]').forEach(b=>b.onclick=()=>openBook(b.dataset.openBook));document.querySelectorAll('[data-book-delete]').forEach(b=>b.onclick=async()=>{if(confirm('Excluir livro?')){await dbDelete(b.dataset.bookDelete);data.books=data.books.filter(x=>x.id!==b.dataset.bookDelete);save();render()}})}
}
let dbReady=new Promise((resolve,reject)=>{const r=indexedDB.open('jeh-books-beta-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
async function dbPut(blob,id){let db=await dbReady;return new Promise((res,rej)=>{let tx=db.transaction('files','readwrite');tx.objectStore('files').put(blob,id);tx.oncomplete=()=>res(id);tx.onerror=()=>rej(tx.error)})}async function dbGet(id){let db=await dbReady;return new Promise((res,rej)=>{let r=db.transaction('files').objectStore('files').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function dbDelete(id){let db=await dbReady;return new Promise(res=>{let tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=res})}
async function loadJS(url){return new Promise((res,rej)=>{let s=document.createElement('script');s.src=url;s.onload=res;s.onerror=()=>rej(Error('Não foi possível carregar o leitor. Verifique a conexão.'));document.head.appendChild(s)})}
async function openBook(id){const b=data.books.find(x=>x.id===id);if(!b)return;let blob=await dbGet(id);if(!blob)return alert('Arquivo não encontrado neste navegador. Adicione o livro novamente.');const target=$('#book-modal');target.innerHTML=`<div class="card"><div class="row between"><h2>${esc(b.title)}</h2><button class="secondary" id="book-close">Fechar</button></div><div id="book-reader">Carregando…</div><div id="book-control" class="row"></div></div>`;$('#book-close').onclick=()=>{target.innerHTML='';if(epubBook)epubBook.destroy()};target.scrollIntoView({behavior:'smooth'});
if(b.type==='pdf'){const url=URL.createObjectURL(blob);const reader=$('#book-reader');reader.innerHTML=`<iframe id="pdf-frame" class="book-reader" title="Leitor PDF" src="${url}#page=${b.page||1}"></iframe>`;$('#book-control').innerHTML=`<button class="secondary" id="prev-page">← Página anterior</button><label>Página atual <input type="number" id="page-num" min="1" style="width:95px" value="${b.page||1}"></label><button class="secondary" id="next-page">Próxima página →</button><button class="primary" id="save-page">Salvar página</button>`;const jump=()=>{const n=Math.max(1,Number($('#page-num').value)||1);b.page=n;$('#pdf-frame').src=url+'#page='+n;save()};$('#prev-page').onclick=()=>{$('#page-num').value=Math.max(1,Number($('#page-num').value)-1);jump()};$('#next-page').onclick=()=>{$('#page-num').value=Number($('#page-num').value)+1;jump()};$('#save-page').onclick=()=>{jump();alert('Página salva para continuar depois.')};return}
try{if(!window.ePub)await loadJS('https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js');const array=await blob.arrayBuffer();epubBook=ePub(array);$('#book-reader').innerHTML='<div id="epub-area"></div>';epubRendition=epubBook.renderTo('epub-area',{width:'100%',height:'100%',spread:'none'});await epubRendition.display(b.cfi||undefined);epubRendition.on('relocated',loc=>{if(loc?.start?.cfi){b.cfi=loc.start.cfi;save()}});$('#book-control').innerHTML='<button class="secondary" id="epub-prev">← Anterior</button><button class="secondary" id="epub-next">Próximo →</button><span class="muted small">A posição é salva automaticamente.</span>';$('#epub-prev').onclick=()=>epubRendition.prev();$('#epub-next').onclick=()=>epubRendition.next()}catch(e){$('#book-reader').innerHTML=`<p>Não foi possível abrir este EPUB: ${esc(e.message)}</p>`}}
setInterval(()=>{if(page==='home'&&data.slides.length>1){carouselPos++;let el=$('#slide');if(el){let s=data.slides[carouselPos%data.slides.length];el.innerHTML=`<img class="photo" src="${s.src}" style="width:100%;height:245px"><p>${esc(s.caption)}</p>`}}},6000);
render();
</script></body></html>
