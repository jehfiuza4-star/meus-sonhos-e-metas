  <style>
    :root {--page:#faf9f5;--card:#fff;--ink:#29382f;--muted:#7b887c;--line:#e8eae3;--sage:#6c927b;--sage-dark:#375f49;--mint:#eaf1e9;--cream:#f5efe2;--shadow:0 12px 45px rgba(46,72,55,.055);--nav-h:82px;}
    *{box-sizing:border-box}html{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;scroll-behavior:smooth}body{margin:0;background:var(--page);color:var(--ink);font-size:15px;line-height:1.42}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b4d9bf;outline-offset:3px}
    .app{display:flex;min-height:100svh}.sidebar{width:250px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:38px 20px;display:flex;flex-direction:column;gap:32px;position:sticky;top:0;height:100svh}.brand{display:flex;align-items:center;gap:12px;padding-left:11px;font-weight:760;font-size:17px;letter-spacing:-.5px}.brand-icon{width:42px;height:42px;background:#dcebe0;border-radius:15px;display:grid;place-items:center;color:#40775c;font-size:24px}.brand small{font-size:10px;letter-spacing:2.5px;color:var(--sage);font-weight:800;display:block;padding-top:2px}.nav-item{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:12px;text-align:left;padding:13px 15px;color:#738177;border-radius:13px;margin-bottom:5px;font-weight:660}.nav-item .i{font-size:20px;width:24px;text-align:center}.nav-item.active{background:var(--mint);color:var(--sage-dark)}.sidebar-quote{margin-top:auto;background:#f0f4ed;border-radius:18px;padding:19px;color:#64816c;font-size:13px}.sidebar-quote strong{display:block;color:#385e46;font-size:17px;margin-bottom:8px;line-height:1.3}
    main{flex:1;min-width:0;max-width:1180px;margin:0 auto;padding:44px 48px 96px}.top{display:flex;justify-content:space-between;gap:15px;align-items:start;margin-bottom:30px}.eyebrow{color:#6f9b81;text-transform:uppercase;font-size:11px;font-weight:800;letter-spacing:2.7px}.page-title{font-size:clamp(27px,4vw,38px);letter-spacing:-1.6px;line-height:1.13;margin:10px 0 10px;font-weight:780}.subtle{color:var(--muted)}.top-actions{display:flex;align-items:center;gap:9px}.year-select,.search,.filter,.field{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 13px;color:var(--ink)}.year-select{font-weight:760}.btn{border:0;border-radius:14px;padding:12px 17px;font-weight:720;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,background .15s}.btn:active{transform:scale(.97)}.primary{background:#4c8063;color:white}.primary:hover{background:#37694e}.secondary{background:#edf2eb;color:#426b51}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{background:#fbebe7;color:#b34e40}.sm{padding:8px 11px;border-radius:10px;font-size:12px}.hero{background:linear-gradient(113deg,#e5eee2 0%,#f4eee3 92%);border-radius:26px;padding:29px 31px;display:flex;justify-content:space-between;gap:22px;align-items:center;overflow:hidden;position:relative}.hero:after{content:"✦";position:absolute;right:28%;top:-55px;font-size:190px;color:rgba(255,255,255,.26);pointer-events:none}.hero-copy{position:relative;z-index:1;max-width:570px}.hero h2{font-size:clamp(23px,3vw,31px);line-height:1.15;letter-spacing:-1px;margin:10px 0 10px}.hero p{color:#657967;margin:0 0 18px;max-width:420px}.ring{--p:0;width:144px;height:144px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#69987a calc(var(--p)*1%),rgba(255,255,255,.68) 0);position:relative;z-index:1}.ring-inner{background:#f6f4ec;border-radius:50%;width:115px;height:115px;display:flex;flex-direction:column;justify-content:center;align-items:center}.ring-inner strong{font-size:29px;letter-spacing:-1px}.ring-inner span{font-size:11px;color:#7b8a7c}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:21px 0 31px}.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow)}.stat .stat-label{color:var(--muted);font-weight:560;font-size:13px;display:flex;align-items:center;justify-content:space-between}.stat .emoji{font-size:20px}.stat strong{display:block;font-size:31px;margin-top:9px;letter-spacing:-1.2px}.section-title{font-size:19px;font-weight:750;letter-spacing:-.6px;margin:0}.section-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 16px}.simple-link{background:transparent;border:0;color:#59846a;font-weight:720}.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 0 19px;padding-bottom:3px}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:50px;color:#64756b;background:white;padding:9px 14px;font-weight:660;font-size:12px}.chip.active{color:white;background:#4f8265;border-color:#4f8265}.goal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.goal{background:white;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:210px}.goal-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.goal-icon{display:grid;place-items:center;background:#eff5ec;border-radius:15px;width:48px;height:48px;font-size:23px}.goal-category{font-size:11px;color:#64826f;font-weight:750}.goal h3{margin:15px 0 6px;font-size:17px;letter-spacing:-.3px}.goal p{color:var(--muted);margin:0 0 18px;font-size:12px;overflow-wrap:anywhere}.progressline{height:8px;background:#e9eee8;border-radius:20px;overflow:hidden;margin:8px 0}.progressline span{display:block;height:100%;border-radius:20px;background:#7fac8a}.goal-bottom{margin-top:auto}.goal-meta{display:flex;justify-content:space-between;align-items:center;color:#7e8d80;font-size:12px}.goal-actions{display:flex;gap:8px;margin-top:14px}.goal-actions button{flex:1}.badge{border-radius:40px;padding:6px 9px;font-size:11px;background:#f6f0e4;color:#967b47;font-weight:720}.badge.completed{background:#e4f2e9;color:#468264}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}.search{min-width:220px;flex:1}.filter{max-width:205px}.empty{border:1px dashed #d3dfd1;border-radius:22px;background:#fff;grid-column:1/-1;text-align:center;padding:40px 22px}.empty .big{font-size:42px}.empty h3{margin:14px 0 7px}.empty p{color:var(--muted);margin:0 auto 20px;max-width:380px}.fullbox{background:#fff;border:1px solid var(--line);padding:24px;border-radius:22px;box-shadow:var(--shadow)}.category-row{display:grid;grid-template-columns:145px 1fr 42px;align-items:center;gap:14px;margin:15px 0}.category-bar{height:11px;border-radius:20px;background:#ebefea;overflow:hidden}.category-bar span{height:100%;display:block;border-radius:20px;background:#89ac91}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.highlight{font-size:32px;font-weight:780;letter-spacing:-1px;margin:9px 0}.quote-card{background:#eaf0e7;border-radius:20px;padding:22px;color:#4d795f}.milestone{padding:15px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.milestone:last-child{border-bottom:0}.achievement{display:flex;align-items:center;gap:15px;padding:16px;border:1px solid var(--line);border-radius:17px;margin-bottom:11px}.medal{font-size:25px;display:grid;place-items:center;background:#fff6dd;width:50px;height:50px;border-radius:15px}.achievement strong{display:block}.achievement small{display:block;color:var(--muted);margin-top:4px}
    .bottom-nav{display:none}.overlay{position:fixed;inset:0;z-index:50;background:rgba(30,48,37,.45);display:flex;align-items:center;justify-content:center;padding:18px}.overlay[hidden]{display:none}.modal{background:#fff;border-radius:23px;padding:25px;width:min(100%,580px);max-height:min(92svh,850px);overflow-y:auto;box-shadow:0 30px 90px rgba(0,0,0,.2)}.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-header h2{margin:0;font-size:23px}.x{border:0;background:#f0f4ef;border-radius:50%;width:36px;height:36px;color:#526958;font-size:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.form-field label{font-size:12px;font-weight:720;color:#607565}.form-field input,.form-field select,.form-field textarea{width:100%;background:#fafbf8;border:1px solid #dde5dc;padding:12px;border-radius:11px;color:var(--ink)}.form-field textarea{min-height:85px;resize:vertical}.form-field input[type=range]{padding:7px 0;accent-color:#4c8063}.step-row{display:flex;align-items:center;gap:10px;margin:8px 0}.step-row input[type=text]{flex:1;min-width:0}.step-row input[type=checkbox]{accent-color:#508467;transform:scale(1.2)}.step-add{display:flex;gap:7px}.step-add input{flex:1;min-width:0;background:#fafbf8;border:1px solid #dde5dc;padding:10px;border-radius:11px}.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}.settings-row{border-bottom:1px solid var(--line);padding:16px 0;display:flex;justify-content:space-between;align-items:center;gap:16px}.settings-row:last-child{border:0}.settings-row p{margin:4px 0 0;font-size:12px;color:var(--muted)}.file-label{cursor:pointer}.hidden{display:none !important}.toast{position:fixed;z-index:70;bottom:28px;left:50%;transform:translateX(-50%);background:#273c2e;color:white;padding:12px 18px;border-radius:13px;font-size:13px;box-shadow:0 10px 35px #0002;max-width:calc(100vw - 30px)}
    @media(max-width:1000px){.sidebar{width:210px}.sidebar-quote{display:none}main{padding:35px 28px 100px}}
    @media(max-width:720px){.sidebar{display:none}main{padding:26px 17px calc(115px + env(safe-area-inset-bottom));width:100%}.top{margin-bottom:22px}.top-actions{align-self:center}.top .primary{width:42px;height:42px;padding:0;font-size:21px}.top .primary .btn-word{display:none}.year-select{padding:10px 8px}.hero{padding:23px 21px;border-radius:23px;gap:12px}.hero h2{font-size:23px}.hero p{font-size:12px}.hero .btn{padding:10px 12px;font-size:12px}.ring{width:98px;height:98px}.ring-inner{width:77px;height:77px}.ring-inner strong{font-size:21px}.ring-inner span{font-size:9px}.stats{gap:8px;margin:14px 0 26px}.stat{border-radius:15px;padding:13px}.stat .stat-label{font-size:10px;min-height:31px}.stat strong{font-size:26px;margin-top:8px}.stat .emoji{font-size:14px}.goal-grid{grid-template-columns:1fr}.goal{min-height:188px}.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:9px 5px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}.bottom-nav .nav-item{margin:0;border-radius:12px;display:flex;flex-direction:column;gap:3px;padding:7px 8px;font-size:10px;align-items:center;justify-content:center;min-width:58px}.bottom-nav .nav-item .i{font-size:21px}.mini-grid{grid-template-columns:1fr}.category-row{grid-template-columns:110px 1fr 35px;gap:8px;font-size:12px}.modal{padding:20px 17px}.form-grid{grid-template-columns:1fr 1fr}.filter{max-width:none;flex:1}.search{min-width:100%}}
    @media(max-width:375px){.hero{align-items:end}.hero p{display:none}.hero h2{font-size:21px}.ring{width:80px;height:80px}.ring-inner{width:63px;height:63px}.ring-inner strong{font-size:18px}.ring-inner span{font-size:8px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-icon">✿</div><div>Meus Sonhos <small>& METAS</small></div></div>
    <nav id="desktopNav" aria-label="Navegação principal"></nav>
    <div class="sidebar-quote"><strong>Floresça no seu tempo. 🌱</strong> Cada pequeno passo conta na construção dos seus sonhos.</div>
  </aside>
  <main id="main" aria-live="polite"></main>
</div>
<nav class="bottom-nav" id="mobileNav" aria-label="Navegação principal para celular"></nav>
<div class="overlay" id="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
(()=>{'use strict';
 const STORAGE='meus-sonhos-metas-v1';
 const cats=[['Estudos','📚'],['Espiritualidade','🕊️'],['Saúde','🌿'],['Finanças','💰'],['Carreira','💼'],['Viagens','✈️'],['Casa','🏡'],['Pessoal','✨'],['Outros','🌸']];
 const pages=[['inicio','Início','⌂'],['metas','Minhas metas','◎'],['visao','Meu progresso','▥'],['conquistas','Conquistas','✦'],['ajustes','Ajustes','⚙']];
 const nowYear=new Date().getFullYear();let year=nowYear,section='inicio',category='Todas',search='',statusFilter='Todos',editing=null,stepsBuffer=[];
 const uid=()=>globalThis.crypto?.randomUUID?.()||('id-'+Date.now()+'-'+Math.random().toString(36).slice(2));
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fmt=d=>{if(!d)return '';let a=String(d).split('-');return a.length===3?`${a[2]}/${a[1]}/${a[0]}`:esc(d)};
 const short=s=>s.length>105?s.slice(0,102)+'…':s;
 function load(){try{let v=JSON.parse(localStorage.getItem(STORAGE)||'[]');return Array.isArray(v)?v:[]}catch{return []}}
 let goals=load();function save(){try{localStorage.setItem(STORAGE,JSON.stringify(goals));return true}catch{notify('Armazenamento cheio. Exporte seus dados para não perder nada.');return false}}
 function icon(c){return cats.find(x=>x[0]===c)?.[1]||'🌸'}
 function progress(g){let steps=Array.isArray(g.steps)?g.steps:[];return steps.length?Math.round(steps.filter(x=>x.done).length*100/steps.length):Math.min(100,Math.max(0,Number(g.progress)||0))}
 function complete(g){return progress(g)===100||g.status==='Concluída'}
 function annual(){return goals.filter(g=>Number(g.year)===year)}
 function notify(t){const e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(notify.t);notify.t=setTimeout(()=>e.hidden=true,3200)}
 function top(title,desc=''){
  const opts=[...new Set([...Array.from({length:11},(_,i)=>nowYear-2+i),...goals.map(g=>Number(g.year)),year])].filter(Number.isFinite).sort((a,b)=>a-b).map(y=>`<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('');
  return `<div class="top"><div><div class="eyebrow">Um passo de cada vez ✦</div><h1 class="page-title">${title}</h1>${desc?`<div class="subtle">${desc}</div>`:''}</div><div class="top-actions"><select class="year-select" id="yearSelect" aria-label="Escolher o ano">${opts}</select><button class="btn primary" data-action="new" aria-label="Adicionar meta">＋ <span class="btn-word">Nova meta</span></button></div></div>`;
 }
 function navigation(){const out=pages.map(p=>`<button class="nav-item ${section===p[0]?'active':''}" data-page="${p[0]}" ${section===p[0]?'aria-current="page"':''}><span class="i" aria-hidden="true">${p[2]}</span><span>${p[1]}</span></button>`).join('');document.getElementById('desktopNav').innerHTML=out;document.getElementById('mobileNav').innerHTML=out;}
 function empty(title,desc,cta=true){return `<div class="empty"><div class="big">🌷</div><h3>${title}</h3><p>${desc}</p>${cta?`<button class="btn primary" data-action="new">＋ Criar uma meta</button>`:''}</div>`}
 function goalCard(g){let p=progress(g),done=complete(g);return `<article class="goal"><div class="goal-top"><div class="goal-icon">${icon(g.category)}</div><span class="badge ${done?'completed':''}">${done?'✓ Concluída':esc(g.priority||'Minha meta')}</span></div><h3>${esc(g.title)}</h3><p>${esc(short(g.notes||g.category||''))}</p><div class="goal-bottom"><div class="goal-meta"><span>${esc(g.category||'Outros')} ${g.target?'· '+fmt(g.target):''}</span><strong>${done?100:p}%</strong></div><div class="progressline"><span style="width:${done?100:p}%"></span></div><div class="goal-actions"><button class="btn secondary sm" data-action="edit" data-id="${esc(g.id)}">✎ Editar</button><button class="btn ${done?'ghost':'primary'} sm" data-action="toggle" data-id="${esc(g.id)}">${done?'↶ Reabrir':'✓ Concluir'}</button></div></div></article>`}
 function summary(){let ys=annual(),done=ys.filter(complete).length,p=ys.length?Math.round(ys.reduce((s,g)=>s+(complete(g)?100:progress(g)),0)/ys.length):0;return {ys,done,p,remaining:ys.length-done}}
 function inicio(){let {ys,done,p,remaining}=summary();return top('Seu ano de conquistas ✨','Um espaço só seu para realizar seus sonhos.')+`<section class="hero"><div class="hero-copy"><div class="eyebrow">Bem-vinda ao seu espaço</div><h2>Grandes sonhos começam com pequenos passos.</h2><p>Planeje o que importa, acompanhe sua jornada e celebre cada vitória.</p><button class="btn primary" data-action="new">＋ Adicionar meu sonho</button></div><div class="ring" style="--p:${p}"><div class="ring-inner"><strong>${p}%</strong><span>do seu ano</span></div></div></section><section class="stats"><div class="stat"><div class="stat-label">Total de metas <span class="emoji">🎯</span></div><strong>${ys.length}</strong></div><div class="stat"><div class="stat-label">Concluídas <span class="emoji">🌟</span></div><strong>${done}</strong></div><div class="stat"><div class="stat-label">Em aberto <span class="emoji">🌱</span></div><strong>${remaining}</strong></div></section><div class="section-header"><h2 class="section-title">Minhas metas de ${year}</h2><button class="simple-link" data-page="metas">Ver todas →</button></div><section class="goal-grid">${ys.length?ys.slice(0,4).map(goalCard).join(''):empty('Seu próximo sonho começa aqui','Toque no botão para criar sua primeira meta. Pode ser um curso, uma viagem, um novo hábito ou qualquer desejo seu.')}</section>`}
 function metas(){let ys=annual(),filtered=ys.filter(g=>(category==='Todas'||g.category===category)&&[g.title,g.notes,g.category].some(s=>String(s||'').toLocaleLowerCase('pt-BR').includes(search.toLocaleLowerCase('pt-BR')))&&(statusFilter==='Todos'||(statusFilter==='Concluídas'?complete(g):!complete(g))));let chips=['Todas',...cats.map(c=>c[0])].map(c=>`<button class="chip ${category===c?'active':''}" data-cat="${esc(c)}">${c==='Todas'?'Todas':icon(c)+' '+esc(c)}</button>`).join('');return top('Minhas metas 🎯','Organize seus planos do seu jeito.')+`<div class="toolbar"><input class="search" id="search" type="search" placeholder="Buscar minhas metas..." value="${esc(search)}" aria-label="Buscar metas"><select class="filter" id="statusFilter" aria-label="Filtrar por status"><option ${statusFilter==='Todos'?'selected':''}>Todos</option><option ${statusFilter==='Pendentes'?'selected':''}>Pendentes</option><option ${statusFilter==='Concluídas'?'selected':''}>Concluídas</option></select></div><div class="chips">${chips}</div><div class="section-header"><h2 class="section-title">${filtered.length} ${filtered.length===1?'meta':'metas'} em ${year}</h2></div><div class="goal-grid" id="goalGrid">${filtered.length?filtered.map(goalCard).join(''):empty('Nenhuma meta encontrada','Tente mudar os filtros ou adicione um novo objetivo.')}</div>`}
 function visao(){let {ys,done,p}=summary();let active=cats.map(c=>({name:c[0],emoji:c[1],items:ys.filter(g=>g.category===c[0])})).filter(x=>x.items.length);let due=ys.filter(g=>g.target&&!complete(g)).sort((a,b)=>a.target.localeCompare(b.target)).slice(0,5);return top('Meu progresso 📊','Cada conquista merece ser reconhecida.')+`<div class="mini-grid"><section class="fullbox"><div class="eyebrow">Visão geral de ${year}</div><div class="highlight">${p}% <span style="font-size:13px;font-weight:500;color:#7b887c">de progresso médio</span></div><div class="progressline"><span style="width:${p}%"></span></div><p class="subtle">${done} de ${ys.length} metas concluídas</p></section><section class="quote-card"><div style="font-size:30px">🌿</div><h2 style="margin:10px 0 6px">Seu ritmo também é progresso.</h2><p style="margin:0;font-size:13px">Não compare seu começo com o caminho de ninguém. Sua jornada é única.</p></section></div><section class="fullbox" style="margin-top:17px"><h2 class="section-title">Progresso por categoria</h2>${active.length?active.map(c=>{let a=Math.round(c.items.reduce((s,g)=>s+(complete(g)?100:progress(g)),0)/c.items.length);return `<div class="category-row"><strong>${c.emoji} ${esc(c.name)}</strong><div class="category-bar"><span style="width:${a}%"></span></div><strong>${a}%</strong></div>`}).join(''):'<p class="subtle">Adicione metas para visualizar seus gráficos.</p>'}</section><section class="fullbox" style="margin-top:17px"><h2 class="section-title">Próximos prazos</h2>${due.length?due.map(g=>`<div class="milestone"><div><strong>${icon(g.category)} ${esc(g.title)}</strong><div class="subtle" style="font-size:12px">${esc(g.category)}</div></div><span class="badge">${fmt(g.target)}</span></div>`).join(''):'<p class="subtle">Nenhum prazo pendente por enquanto.</p>'}</section>`}
 function conquistas(){let ys=annual().filter(complete);return top('Minhas conquistas 🏆','Aqui ficam guardadas as vitórias que você já alcançou.')+`<section class="fullbox"><h2 class="section-title" style="margin-bottom:15px">${ys.length} ${ys.length===1?'conquista':'conquistas'} em ${year}</h2>${ys.length?ys.map(g=>`<div class="achievement"><div class="medal">🏅</div><div style="flex:1"><strong>${esc(g.title)}</strong><small>${esc(g.category)} ${g.completedAt?'· Concluída em '+fmt(g.completedAt):''}</small></div><button class="btn ghost sm" data-action="edit" data-id="${esc(g.id)}">Ver</button></div>`).join(''):`<div class="empty"><div class="big">🌟</div><h3>Suas vitórias aparecerão aqui</h3><p>Ao concluir uma meta, ela ficará registrada nesta página.</p></div>`}</section>`}
 function ajustes(){return top('Meu cantinho ⚙️','Cuide dos seus sonhos e dos seus dados.')+`<section class="fullbox"><h2 class="section-title">Seus dados</h2><div class="settings-row"><div><strong>Fazer cópia de segurança</strong><p>Salve todas as metas em um arquivo no seu celular.</p></div><button class="btn secondary sm" data-action="export">↓ Exportar</button></div><div class="settings-row"><div><strong>Restaurar metas</strong><p>Recupere um backup que você exportou anteriormente.</p></div><label class="btn ghost sm file-label" for="importFile">↑ Importar</label><input class="hidden" type="file" accept="application/json,.json" id="importFile"></div><div class="settings-row"><div><strong>Armazenamento local</strong><p>As metas ficam neste dispositivo e navegador. Não há sincronização entre celulares.</p></div><span style="font-size:24px">🔐</span></div></section><section class="fullbox" style="margin-top:17px"><h2 class="section-title">Sobre este aplicativo</h2><p class="subtle">Feito para transformar sonhos em passos concretos. Você pode adicionar metas de qualquer ano, criar etapas e comemorar conquistas.</p><p class="subtle" style="font-size:12px">Importante: antes de limpar o Safari, trocar de aparelho ou desinstalar o aplicativo, exporte seu backup. Se apagar os dados do navegador, suas metas podem ser perdidas.</p></section>`}
 function render(){navigation();let views={inicio,metas,visao,conquistas,ajustes};document.getElementById('main').innerHTML=views[section]();}
 function openForm(id){editing=id||null;let g=goals.find(g=>g.id===id);stepsBuffer=g?.steps?.map(s=>({...s}))||[];const y=g?.year||year;document.getElementById('modal').innerHTML=`<div class="modal-header"><h2 id="modalTitle">${g?'Editar minha meta':'Uma nova meta ✨'}</h2><button class="x" type="button" data-action="close" aria-label="Fechar">×</button></div><form id="goalForm"><div class="form-field"><label for="title">Qual é o seu sonho? *</label><input name="title" id="title" maxlength="110" placeholder="Ex.: Fazer um curso de inglês" required value="${esc(g?.title||'')}"></div><div class="form-grid"><div class="form-field"><label for="category">Categoria</label><select name="category" id="category">${cats.map(c=>`<option value="${c[0]}" ${g?.category===c[0]?'selected':''}>${c[1]} ${c[0]}</option>`).join('')}</select></div><div class="form-field"><label for="year">Ano</label><input name="year" id="year" type="number" min="2000" max="2200" required value="${y}"></div><div class="form-field"><label for="target">Prazo (opcional)</label><input name="target" id="target" type="date" value="${esc(g?.target||'')}"></div><div class="form-field"><label for="priority">Prioridade</label><select name="priority" id="priority">${['Baixa','Média','Alta'].map(p=>`<option ${g?.priority===p?'selected':''}>${p}</option>`).join('')}</select></div></div><div class="form-field"><label for="notes">Detalhes e anotações</label><textarea name="notes" id="notes" placeholder="Por que essa meta é especial?">${esc(g?.notes||'')}</textarea></div><div class="form-field"><label for="progress">Progresso manual: <strong id="progressValue">${g?.progress||0}%</strong></label><input id="progress" name="progress" type="range" min="0" max="100" step="5" value="${g?.progress||0}"><small class="subtle">Se adicionar etapas, o progresso será calculado automaticamente.</small></div><div class="form-field"><label>Pequenas etapas para chegar lá</label><div id="steps"></div><div class="step-add"><input id="newStepText" maxlength="120" placeholder="Ex.: Pesquisar cursos" aria-label="Nova etapa"><button type="button" class="btn secondary sm" data-action="addStep">＋ Adicionar</button></div></div><div class="form-actions">${g?`<button type="button" class="btn danger" data-action="delete" data-id="${esc(g.id)}">Excluir</button>`:''}<button type="button" class="btn ghost" data-action="close">Cancelar</button><button type="submit" class="btn primary">Salvar meta ✓</button></div></form>`;document.getElementById('overlay').hidden=false;renderSteps();document.getElementById('title').focus();}
 function renderSteps(){let target=document.getElementById('steps');if(!target)return;target.innerHTML=stepsBuffer.map((s,i)=>`<div class="step-row"><input type="checkbox" data-step-check="${i}" ${s.done?'checked':''} aria-label="Concluir etapa ${i+1}"><input type="text" value="${esc(s.text)}" maxlength="120" data-step-text="${i}" aria-label="Descrição da etapa ${i+1}"><button type="button" class="btn ghost sm" data-step-remove="${i}" aria-label="Remover etapa">×</button></div>`).join('');}
 function close(){document.getElementById('overlay').hidden=true;editing=null;stepsBuffer=[]}
 function saveForm(form){const f=new FormData(form);let title=String(f.get('title')||'').trim(),yy=Number(f.get('year'));if(!title||!Number.isInteger(yy)||yy<2000||yy>2200){notify('Confira o título e o ano da meta.');return}let old=goals.find(g=>g.id===editing);let g={id:old?.id||uid(),title,category:String(f.get('category')),year:yy,target:String(f.get('target')||''),priority:String(f.get('priority')),notes:String(f.get('notes')||'').slice(0,3000),progress:Number(f.get('progress'))||0,steps:stepsBuffer.filter(s=>s.text.trim()),status:old?.status||'Em andamento',createdAt:old?.createdAt||new Date().toISOString(),completedAt:old?.completedAt||''};let isDone=progress(g)===100;if(g.status==='Concluída'&&!isDone){g.status='Em andamento';g.completedAt=''}if(isDone){g.status='Concluída';g.completedAt ||=new Date().toISOString().slice(0,10)}if(old){goals=goals.map(x=>x.id===old.id?g:x)}else goals.unshift(g);year=yy;save();close();render();notify(old?'Meta atualizada! 🌷':'Meta criada! Um passo mais perto do seu sonho. 🌷')}
 function toggle(id){goals=goals.map(g=>{if(g.id!==id)return g;let copy={...g};if(complete(copy)){copy.steps=(copy.steps||[]).map(s=>({...s,done:false}));copy.progress=0;copy.status='Em andamento';copy.completedAt=''}else{copy.steps=(copy.steps||[]).map(s=>({...s,done:true}));copy.progress=100;copy.status='Concluída';copy.completedAt=new Date().toISOString().slice(0,10)}return copy});save();render();notify('Progresso atualizado!')}
 function exportData(){let data=JSON.stringify({app:'Meus Sonhos & Metas',version:1,exportedAt:new Date().toISOString(),goals},null,2);let blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='backup-meus-sonhos-metas-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Backup criado. Guarde o arquivo em um lugar seguro!')}
 async function importData(file){if(!file)return;try{if(file.size>8*1024*1024)throw Error('Arquivo muito grande.');let parsed=JSON.parse(await file.text()),arr=parsed.goals;if(!Array.isArray(arr)||arr.length>10000)throw Error('Arquivo inválido.');let clean=arr.map(g=>({id:uid(),title:String(g.title||'').slice(0,110),category:cats.some(c=>c[0]===g.category)?g.category:'Outros',year:Number(g.year)||nowYear,target:/^\d{4}-\d{2}-\d{2}$/.test(g.target||'')?g.target:'',priority:['Alta','Média','Baixa'].includes(g.priority)?g.priority:'Média',notes:String(g.notes||'').slice(0,3000),progress:Math.max(0,Math.min(100,Number(g.progress)||0)),steps:Array.isArray(g.steps)?g.steps.slice(0,100).map(s=>({id:uid(),text:String(s.text||'').slice(0,120),done:!!s.done})):[],status:g.status==='Concluída'?'Concluída':'Em andamento',createdAt:String(g.createdAt||''),completedAt:String(g.completedAt||'')})).filter(g=>g.title);if(!clean.length&&arr.length)throw Error('Nenhuma meta válida encontrada.');if(!confirm(`Restaurar ${clean.length} metas? Isso substituirá as ${goals.length} metas que estão neste dispositivo.`))return;goals=clean;save();section='inicio';category='Todas';search='';render();notify('Backup restaurado! 💚')}catch(e){notify('Não foi possível importar: '+e.message)}}
 document.addEventListener('click',e=>{let page=e.target.closest('[data-page]');if(page){section=page.dataset.page;category='Todas';search='';statusFilter='Todos';render();window.scrollTo(0,0);return}let cat=e.target.closest('[data-cat]');if(cat){category=cat.dataset.cat;render();return}let stepRemove=e.target.closest('[data-step-remove]');if(stepRemove){stepsBuffer.splice(Number(stepRemove.dataset.stepRemove),1);renderSteps();return}let btn=e.target.closest('[data-action]');if(!btn)return;let id=btn.dataset.id;switch(btn.dataset.action){case 'new':openForm();break;case 'edit':openForm(id);break;case 'close':close();break;case 'toggle':toggle(id);break;case 'addStep':{let input=document.getElementById('newStepText');let text=input?.value.trim();if(text){stepsBuffer.push({id:uid(),text,done:false});renderSteps();input.value='';input.focus()}break}case 'delete':if(confirm('Tem certeza que deseja excluir esta meta?')){goals=goals.filter(g=>g.id!==id);save();close();render();notify('Meta excluída.')}break;case 'export':exportData();break;}});
 document.addEventListener('change',e=>{if(e.target.id==='yearSelect'){year=Number(e.target.value);render()}if(e.target.id==='statusFilter'){statusFilter=e.target.value;render()}if(e.target.matches('[data-step-check]')){stepsBuffer[Number(e.target.dataset.stepCheck)].done=e.target.checked}if(e.target.id==='importFile'){importData(e.target.files?.[0]);e.target.value=''}});
 document.addEventListener('input',e=>{if(e.target.id==='search'){const start=e.target.selectionStart;search=e.target.value;const main=document.getElementById('main');let ys=annual().filter(g=>(category==='Todas'||g.category===category)&&[g.title,g.notes,g.category].some(s=>String(s||'').toLocaleLowerCase('pt-BR').includes(search.toLocaleLowerCase('pt-BR')))&&(statusFilter==='Todos'||(statusFilter==='Concluídas'?complete(g):!complete(g))));const grid=document.getElementById('goalGrid');if(grid)grid.innerHTML=ys.length?ys.map(goalCard).join(''):empty('Nenhuma meta encontrada','Tente mudar os filtros ou adicione um novo objetivo.');const head=grid?.previousElementSibling?.querySelector('h2');if(head)head.textContent=`${ys.length} ${ys.length===1?'meta':'metas'} em ${year}`}if(e.target.id==='progress')document.getElementById('progressValue').textContent=e.target.value+'%';if(e.target.matches('[data-step-text]'))stepsBuffer[Number(e.target.dataset.stepText)].text=e.target.value});
 document.addEventListener('submit',e=>{if(e.target.id==='goalForm'){e.preventDefault();saveForm(e.target)}});
 document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('overlay').hidden)close()});
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
 render();
})();
</script>
</body></html>
