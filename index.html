<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus Sonhos & Metas</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#533847;background:#fff7fa}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#a74d7d,#e8a6c4);color:white;padding:26px 18px}header h1{margin:0;font-size:26px}header p{margin:7px 0 0}nav{display:flex;gap:8px;overflow:auto;padding:12px;background:#fff;position:sticky;top:0;z-index:2;border-bottom:1px solid #f1d9e4}button,.btn{border:0;border-radius:11px;background:#a74d7d;color:white;padding:10px 14px;cursor:pointer;font-weight:600}nav button{white-space:nowrap;background:#f8e5ee;color:#713b57}nav button.active{background:#a74d7d;color:white}main{max-width:900px;margin:22px auto;padding:0 15px}.panel{background:white;border:1px solid #f0dbe5;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 15px #b76c8c12}h2{margin:0 0 12px}h3{margin:12px 0}label{display:block;font-weight:600;margin:12px 0 5px}input,textarea,select{width:100%;border:1px solid #e8c8d7;border-radius:9px;padding:11px;font:inherit;background:#fff}textarea{min-height:115px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.item{border:1px solid #f0dbe5;border-radius:13px;padding:12px;background:#fffbfd}.item img{max-width:100%;height:150px;object-fit:contain;display:block;margin:auto}.muted{color:#876f7b;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.secondary{background:#f4dfeb;color:#753b5b}.danger{background:#b45362}.hidden{display:none}.bookpage{background:#fffdf5;border:1px solid #dfd0b6;border-radius:10px;min-height:300px;padding:25px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.note-page{background:repeating-linear-gradient(#fffdfc 0,#fffdfc 31px,#efdce7 32px);line-height:32px;min-height:360px;padding:10px 18px}.note-page textarea{border:0;background:transparent;line-height:32px;min-height:330px;outline:none;resize:vertical}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row>*{flex:1}progress{width:100%;accent-color:#a74d7d}.thumb{width:100%;height:110px;object-fit:contain;background:#fff4f9;border-radius:8px}small{color:#876f7b}.reader{font-family:Georgia,serif}.reader .bookpage{font-size:var(--reader-size,17px)}
</style></head><body><header><h1>🌷 Meus Sonhos & Metas</h1><p>Um cantinho para planejar, aprender, ler e registrar sua história.</p></header><nav id="nav"></nav><main id="app"></main><script>
const tabs=['Início','Mural dos Sonhos','Minha Rotina','Plano Bíblico','Cadernos','Biblioteca','Momentos que Inspiram','Meu Perfil'];let tab='Início',activeNotebook=null,notepage=0,reading=null,readerPage=0,readerSize=17,bookResults=[],bookQuery='',readingText='',readingTitle='';const KEY='sonhos_metas_v3';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{}}catch{db={}};for(const [k,v] of Object.entries({dreams:[],routine:[],bible:{},notebooks:[],books:[],moments:[],profile:{name:'',photo:''}}))if(db[k]===undefined)db[k]=v;function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Armazenamento cheio. Exporte seu backup e use imagens menores.')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function show(t){tab=t;render()}function btn(label,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${label}</button>`}function fileData(input,cb){const f=input.files?.[0];if(!f)return;if(f.size>1.5e6){alert('Escolha uma imagem de até 1,5 MB para evitar falta de espaço.');return}let r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)}function render(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="show('${t}')">${t}</button>`).join('');document.getElementById('app').innerHTML=({ 'Início':home,'Mural dos Sonhos':dreams,'Minha Rotina':routine,'Plano Bíblico':bible,'Cadernos':notebooks,'Biblioteca':library,'Momentos que Inspiram':moments,'Meu Perfil':profile})[tab]()}function home(){return `<div class="panel"><h2>Olá, ${esc(db.profile.name||'bem-vinda')}! 💕</h2><p>Seus sonhos, sua rotina e suas leituras em um só lugar.</p><div class="grid"><div class="item">🌟 <b>${db.dreams.length}</b> sonhos</div><div class="item">📚 <b>${db.books.length}</b> livros</div><div class="item">📓 <b>${db.notebooks.length}</b> cadernos</div><div class="item">✨ <b>${db.moments.length}</b> momentos</div></div></div><div class="panel"><h3>Backup dos seus dados</h3><p class="muted">Os dados ficam neste navegador. Exporte backups regularmente; trocar de aparelho ou limpar dados pode apagá-los.</p>${btn('Baixar backup','backup()')} <label>Restaurar backup JSON</label><input type="file" accept=".json,application/json" onchange="restore(this)"></div>`}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='meus-sonhos-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function restore(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d||!Array.isArray(d.dreams))throw 0;if(confirm('Substituir os dados deste navegador pelo backup?')){db=d;save();render()}}catch{alert('Backup inválido ou incompatível')}};r.readAsText(f)}
function dreams(){return `<div class="panel"><h2>🌟 Mural dos Sonhos</h2><form onsubmit="addDream(event)"><label>Meu sonho</label><input name="name" required><label>Descrição</label><textarea name="desc"></textarea><div class="grid"><div><label>Data de início</label><input type="date" name="start"></div><div><label>Data de conclusão desejada</label><input type="date" name="end"></div></div><label>Status</label><select name="status"><option>Não iniciado</option><option>Em andamento</option><option>Realizado</option></select><label>Foto (opcional)</label><input type="file" accept="image/*" id="dreamfile"><div class="actions"><button>Salvar sonho</button></div></form></div><div class="grid">${db.dreams.map(x=>`<div class="item">${x.photo?`<img src="${x.photo}">`:''}<h3>${esc(x.name)}</h3><p>${esc(x.desc)}</p><small>Início: ${esc(x.start||'—')}<br>Conclusão: ${esc(x.end||'—')}</small><p>${esc(x.status)}</p>${btn('Editar',`editDream('${x.id}')`,'secondary')} ${btn('Excluir',`del('dreams','${x.id}')`,'danger')}</div>`).join('')}</div>`}function addDream(e){e.preventDefault();let f=e.target;let x={id:id(),name:f.elements.namedItem("name").value,desc:f.desc.value,start:f.start.value,end:f.end.value,status:f.status.value,photo:''};let fi=document.getElementById('dreamfile');if(fi.files.length)fileData(fi,v=>{x.photo=v;db.dreams.push(x);save();render()});else{db.dreams.push(x);save();render()}}function editDream(i){let x=db.dreams.find(a=>a.id===i);let name=prompt('Nome do sonho',x.name);if(name===null)return;x.name=name;x.desc=prompt('Descrição',x.desc)??x.desc;x.start=prompt('Data inicial (AAAA-MM-DD)',x.start)??x.start;x.end=prompt('Data final (AAAA-MM-DD)',x.end)??x.end;x.status=prompt('Status',x.status)??x.status;save();render()}function del(k,i){if(confirm('Excluir este item?')){db[k]=db[k].filter(x=>x.id!==i);save();render()}}
function routine(){return `<div class="panel"><h2>🗓️ Minha Rotina</h2><form onsubmit="addRoutine(event)"><label>Atividade</label><input name="name" required><label>Tipo de referência (opcional)</label><input name="ref" placeholder="Ex.: Inglês, estudo bíblico"><label>Duração de referência em minutos (opcional)</label><input type="number" name="target" min="1"><button>Salvar atividade</button></form></div>${db.routine.map(x=>`<div class="panel"><h3>${esc(x.name)}</h3><p class="muted">${esc(x.ref||'Sem referência')} · ${x.target?x.target+' min de referência':'Sem tempo fixo'}</p><div class="grid"><div><label>Minutos estudados/realizados</label><input type="number" min="0" id="mins-${x.id}" placeholder="Ex.: 40"></div><div><label>Data</label><input type="date" id="date-${x.id}" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="actions">${btn('Registrar',`logRoutine('${x.id}')`)} ${btn('Editar',`editRoutine('${x.id}')`,'secondary')} ${btn('Excluir',`del('routine','${x.id}')`,'danger')}</div><p><b>Registros:</b> ${x.logs?.length||0} · <b>Tempo total:</b> ${(x.logs||[]).reduce((s,a)=>s+a.min,0)} min</p><p class="muted">${(x.logs||[]).slice(-5).map(l=>esc(l.date)+': '+l.min+' min').join(' · ')}</p></div>`).join('')}`}function addRoutine(e){e.preventDefault();let f=e.target;db.routine.push({id:id(),name:f.elements.namedItem("name").value,ref:f.ref.value,target:Number(f.target.value)||null,logs:[]});save();render()}function logRoutine(i){let x=db.routine.find(a=>a.id===i),min=Number(document.getElementById('mins-'+i).value),date=document.getElementById('date-'+i).value;if(!date||!Number.isFinite(min)||min<0)return alert('Informe data e minutos válidos.');x.logs.push({date,min});save();render()}function editRoutine(i){let x=db.routine.find(a=>a.id===i);x.name=prompt('Atividade',x.name)??x.name;x.ref=prompt('Referência',x.ref)??x.ref;let t=prompt('Tempo de referência (minutos, vazio = opcional)',x.target??'');if(t!==null)x.target=Number(t)||null;save();render()}
const booksBible=['Gênesis','Êxodo','Levítico','Números','Deuteronômio','Josué','Juízes','Rute','1 Samuel','2 Samuel','1 Reis','2 Reis','1 Crônicas','2 Crônicas','Esdras','Neemias','Ester','Jó','Salmos','Provérbios','Eclesiastes','Cânticos','Isaías','Jeremias','Lamentações','Ezequiel','Daniel','Oseias','Joel','Amós','Obadias','Jonas','Miqueias','Naum','Habacuque','Sofonias','Ageu','Zacarias','Malaquias','Mateus','Marcos','Lucas','João','Atos','Romanos','1 Coríntios','2 Coríntios','Gálatas','Efésios','Filipenses','Colossenses','1 Tessalonicenses','2 Tessalonicenses','1 Timóteo','2 Timóteo','Tito','Filemom','Hebreus','Tiago','1 Pedro','2 Pedro','1 João','2 João','3 João','Judas','Apocalipse'];const counts=[50,40,27,36,34,24,21,4,31,24,22,25,29,36,10,13,10,42,150,31,12,8,66,52,5,48,12,14,3,9,1,4,7,3,3,3,2,14,4,28,16,24,21,28,16,16,13,6,6,4,4,5,3,6,4,3,1,13,5,5,3,5,1,1,1,22];let chapters=booksBible.flatMap((b,i)=>Array.from({length:counts[i]},(_,n)=>`${b} ${n+1}`));function bible(){let day=Math.max(0,Math.floor((Date.now()-new Date(new Date().getFullYear(),0,1))/86400000));let d=String(day);let v=db.bible[d]||{};return `<div class="panel"><h2>📖 Plano Bíblico</h2><p>Plano anual sequencial de capítulos, distribuído em 365 dias. As leituras e anotações ficam salvas por dia.</p><label>Dia do plano (1–365)</label><input type="number" min="1" max="365" id="bday" value="${day+1<=365?day+1:365}" onchange="bibleDay(this.value)"><div id="bcontent">${bibleContent(day)}</div></div>`}function bibleContent(day){let start=Math.floor(day*chapters.length/365),end=Math.floor((day+1)*chapters.length/365),v=db.bible[day]||{};return `<h3>Dia ${day+1}: ${chapters.slice(start,end).map(esc).join(', ')}</h3><p class="muted">Para ler, use sua tradução bíblica autorizada preferida. O texto bíblico não está embutido nesta versão.</p><label><input style="width:auto" type="checkbox" ${v.done?'checked':''} onchange="setBible(${day},'done',this.checked)"> Leitura concluída</label><label>Minhas anotações desta leitura</label><textarea oninput="setBible(${day},'notes',this.value)" placeholder="O que aprendi hoje?">${esc(v.notes||'')}</textarea>`}function bibleDay(n){let day=Math.max(0,Math.min(364,Number(n)-1));document.getElementById('bcontent').innerHTML=bibleContent(day)}function setBible(d,k,v){db.bible[d]??={};db.bible[d][k]=v;save()}
function notebooks(){if(activeNotebook){let n=db.notebooks.find(x=>x.id===activeNotebook);if(!n){activeNotebook=null;return notebooks()}let page=n.pages[notepage]||'';return `<div class="panel"><div class="actions">${btn('← Meus cadernos','activeNotebook=null;render()','secondary')}</div><h2>📓 ${esc(n.name)}</h2><div class="note-page"><textarea aria-label="Texto da página" oninput="writePage(this.value)" placeholder="Comece a escrever...">${esc(page)}</textarea></div><div class="actions">${btn('← Página anterior','movePage(-1)','secondary')} <span style="padding:10px">Página ${notepage+1} de ${n.pages.length}</span> ${btn('Próxima página →','movePage(1)')}</div></div>`}return `<div class="panel"><h2>📓 Meus Cadernos</h2><form onsubmit="newNotebook(event)"><label>Nome do caderno (somente na capa)</label><input name="name" required placeholder="Ex.: Reflexões"><button>Criar caderno</button></form></div><div class="grid">${db.notebooks.map(n=>`<div class="item"><h3>📔 ${esc(n.name)}</h3><p>${n.pages.length} página(s)</p>${btn('Abrir',`activeNotebook='${n.id}';notepage=0;render()`)} ${btn('Excluir',`del('notebooks','${n.id}')`,'danger')}</div>`).join('')}</div>`}function newNotebook(e){e.preventDefault();let n={id:id(),name:e.target.elements.namedItem("name").value,pages:['']};db.notebooks.push(n);activeNotebook=n.id;notepage=0;save();render()}function writePage(v){let n=db.notebooks.find(x=>x.id===activeNotebook);n.pages[notepage]=v;save()}function movePage(step){let n=db.notebooks.find(x=>x.id===activeNotebook);let p=notepage+step;if(p<0)return;if(p>=n.pages.length)n.pages.push('');notepage=p;save();render()}
function library(){if(reading)return readerUI();return `<div class="panel"><h2>📚 Minha Biblioteca</h2><p>Pesquise títulos e autores. O catálogo usa Open Library; a leitura gratuita usa obras legalmente disponibilizadas pelo Project Gutenberg.</p><div class="row"><input id="bookq" value="${esc(bookQuery)}" placeholder="Título ou autor"><button onclick="searchBooks()">Pesquisar</button></div><p class="muted">A pesquisa requer internet. Nem todo livro tem texto completo disponível.</p><div id="searchresults">${bookResults.map(bookCard).join('')}</div></div><div class="panel"><h3>Minha estante (${db.books.length})</h3><div class="grid">${db.books.map(x=>`<div class="item">${x.cover?`<img src="${esc(x.cover)}">`:''}<b>${esc(x.title)}</b><p class="muted">${esc(x.author)}</p><label>Situação</label><select onchange="setBookStatus('${x.id}',this.value)">${['Quero ler','Lendo','Concluído','Favorito'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select><div class="actions">${btn('Ler agora',`readBook('${x.id}')`)} ${btn('Remover',`del('books','${x.id}')`,'danger')}</div></div>`).join('')}</div></div>`}function bookCard(x){return `<div class="item" style="margin-top:12px"><div class="row">${x.cover?`<img style="width:85px;height:110px;object-fit:contain" src="${esc(x.cover)}">`:''}<div><b>${esc(x.title)}</b><p class="muted">${esc(x.author)}</p></div></div>${btn('Adicionar à estante',`addBook('${x.id}')`)} ${btn('Ler agora',`readResult('${x.id}')`,'secondary')}</div>`}async function searchBooks(){bookQuery=document.getElementById('bookq').value.trim();if(!bookQuery)return;document.getElementById('searchresults').textContent='Pesquisando...';try{let r=await fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(bookQuery)+'&limit=12');if(!r.ok)throw 0;let d=await r.json();bookResults=d.docs.map(x=>({id:id(),title:x.title||'',author:(x.author_name||[]).slice(0,2).join(', '),cover:x.cover_i?`https://covers.openlibrary.org/b/id/${x.cover_i}-M.jpg`:'',status:'Quero ler'}));document.getElementById('searchresults').innerHTML=bookResults.map(bookCard).join('')||'Nenhum resultado.'}catch{document.getElementById('searchresults').textContent='Não foi possível consultar o catálogo. Verifique a conexão.'}}function addBook(i){let x=bookResults.find(a=>a.id===i);if(!x)return;if(!db.books.some(b=>b.title===x.title&&b.author===x.author)){db.books.push({...x});save()}render()}function setBookStatus(i,s){db.books.find(x=>x.id===i).status=s;save()}function readResult(i){let x=bookResults.find(a=>a.id===i);if(x){if(!db.books.some(b=>b.title===x.title&&b.author===x.author))db.books.push({...x});save();readBook(x.id)}}async function readBook(i){let x=db.books.find(a=>a.id===i);if(!x)return;reading=i;readingText='';readingTitle=x.title;readerPage=x.page||0;render();document.getElementById('readercontent').textContent='Buscando uma edição gratuita e legal...';try{let r=await fetch('https://gutendex.com/books/?search='+encodeURIComponent(x.title));if(!r.ok)throw 0;let d=await r.json();let result=d.results.find(b=>b.title.toLowerCase().includes(x.title.toLowerCase().slice(0,12)))||d.results[0];let url=result?.formats?.['text/plain; charset=utf-8']||result?.formats?.['text/plain; charset=us-ascii']||result?.formats?.['text/plain'];if(!url){document.getElementById('readercontent').textContent='Não encontramos uma edição de texto integral disponível neste catálogo. Você pode manter o livro na estante.';return}let t=await fetch(url);if(!t.ok)throw 0;readingText=await t.text();readerPage=Math.min(readerPage,Math.max(0,Math.ceil(readingText.length/1700)-1));render()}catch{document.getElementById('readercontent').textContent='Não foi possível abrir o texto neste navegador. Pode haver restrições de acesso do servidor. Tente outra obra.'}}function readerUI(){let x=db.books.find(a=>a.id===reading);let pages=Math.max(1,Math.ceil(readingText.length/1700));return `<div class="panel reader" style="--reader-size:${readerSize}px"><div class="actions">${btn('← Biblioteca','reading=null;render()','secondary')} ${btn('A−','readerSize=Math.max(13,readerSize-2);render()','secondary')} ${btn('A+','readerSize=Math.min(26,readerSize+2);render()','secondary')}</div><h2>${esc(readingTitle)}</h2><div class="bookpage" id="readercontent">${esc(readingText?readingText.slice(readerPage*1700,(readerPage+1)*1700):'Carregando...')}</div><div class="actions">${btn('← Anterior','pageTurn(-1)','secondary')} <span style="padding:10px">${readerPage+1} / ${pages}</span> ${btn('Próxima →','pageTurn(1)')}</div><p class="muted">Paginação aproximada; verifique as condições de uso da edição no seu país.</p></div>`}function pageTurn(s){if(!readingText)return;readerPage=Math.max(0,Math.min(Math.ceil(readingText.length/1700)-1,readerPage+s));let x=db.books.find(a=>a.id===reading);if(x)x.page=readerPage;save();render()}
function moments(){return `<div class="panel"><h2>✨ Momentos que Inspiram</h2><p class="muted">Imagens menores e inteiras, sem cortes.</p><label>Adicionar foto</label><input type="file" accept="image/*" onchange="addMoment(this)"></div><div class="grid">${db.moments.map(x=>`<div class="item"><img class="thumb" src="${x.photo}">${btn('Excluir',`del('moments','${x.id}')`,'danger')}</div>`).join('')}</div>`}function addMoment(el){fileData(el,v=>{db.moments.push({id:id(),photo:v});save();render()})}function profile(){return `<div class="panel"><h2>👤 Meu Perfil</h2>${db.profile.photo?`<img style="width:130px;height:130px;border-radius:50%;object-fit:cover" src="${db.profile.photo}">`:''}<label>Nome</label><input value="${esc(db.profile.name)}" oninput="db.profile.name=this.value;save()"><label>Foto de perfil</label><input type="file" accept="image/*" onchange="fileData(this,v=>{db.profile.photo=v;save();render()})"><p class="muted">Seu perfil é salvo neste navegador.</p></div>`}render();
</script></body></html>
